name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `cargo build` runs `build.rs`, which invokes draad codegen and writes
      # `_generated.rs` into `OUT_DIR`. The ts-rs per-type bindings come from
      # `cargo test export_bindings`; then a second build with `CINEMA_EMIT_TS=1`
      # has draad emit the `frontend/src/lib/schema/*.ts` files for the
      # frontend job.
      - name: Generate schema + build
        run: |
          cargo test --quiet export_bindings
          CINEMA_EMIT_TS=1 cargo build
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/target/draad-bindings

      - name: Upload generated TS schema
        uses: actions/upload-artifact@v4
        with:
          name: ts-schema
          path: frontend/src/lib/schema/*.ts

  frontend:
    name: frontend
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          name: ts-schema
          path: frontend/src/lib/schema

      - run: bun install
        working-directory: frontend

      - run: bun run build
        working-directory: frontend
