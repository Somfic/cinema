name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Regenerate `src/_generated.rs` and `frontend/src/lib/schema/*.ts` from
      # the Rust traits/types so downstream jobs have the up-to-date schema.
      - name: Generate schema
        run: |
          cargo run --manifest-path ../draad/Cargo.toml -p draad --features codegen --bin draad --quiet -- --rust-only
          TS_RS_EXPORT_DIR="$PWD/target/draad-bindings" cargo test --quiet export_bindings
          TS_RS_EXPORT_DIR="$PWD/target/draad-bindings" cargo run --manifest-path ../draad/Cargo.toml -p draad --features codegen --bin draad --quiet

      - name: Upload generated schema
        uses: actions/upload-artifact@v4
        with:
          name: schema
          path: |
            src/_generated.rs
            frontend/src/lib/schema/*.ts

  cargo-check:
    name: backend
    needs: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: schema
          path: .

      - run: cargo check

  frontend-build:
    name: frontend
    needs: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          name: schema
          path: .

      - run: bun install
        working-directory: frontend

      - run: bun run build
        working-directory: frontend
