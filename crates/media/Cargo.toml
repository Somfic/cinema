[package]
name = "media"
version = "0.1.0"
edition = "2024"
description = "GStreamer-backed probing, HLS packaging and transcoding for cinema"

[dependencies]
gst = { package = "gstreamer", version = "0.24" }
gst-app = { package = "gstreamer-app", version = "0.24" }
gst-base = { package = "gstreamer-base", version = "0.24" }
gst-video = { package = "gstreamer-video", version = "0.24" }
gst-pbutils = { package = "gstreamer-pbutils", version = "0.24" }
# Compiled in and registered statically: distro packages of gst-plugins-rs are
# rare, and `cmafmux` is the only element we need from it.
gst-plugin-fmp4 = { version = "0.14", features = ["static"] }

tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "fs", "macros"] }
tokio-util = "0.7"
bytes = "1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
rayon = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
