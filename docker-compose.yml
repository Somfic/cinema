# cinema + a self-hosted trailers-api fallback. PO tokens for YouTube are baked
# into the cinema image (bgutil provider in script mode), so no PO sidecar is
# needed here. trailers-api is the fallback source when YouTube fails: it pulls
# trailers straight from Apple TV / Netflix / Prime CDNs.
services:
  cinema:
    image: ghcr.io/somfic/cinema
    # Or build locally instead of pulling the published image:
    # build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "6881:6881"
    volumes:
      - ./data:/app/data
    environment:
      CINEMA_TMDB_API_KEY: ${CINEMA_TMDB_API_KEY}
      # Fall back to trailers-api over the compose network when YouTube fails.
      # Remove this to disable the fallback.
      CINEMA_TRAILERS_API_URL: http://trailers-api:3000
    depends_on:
      - trailers-api

  # Third-party service — see https://github.com/Theryston/trailers-api for its
  # own configuration (storage/DB). Its port 3000 stays internal to the compose
  # network; it is not published to the host.
  trailers-api:
    build: https://github.com/Theryston/trailers-api.git
    restart: unless-stopped
    environment:
      DATA_FOLDER: /data
    volumes:
      - ./data/trailers-api:/data
